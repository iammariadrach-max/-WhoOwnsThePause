<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Кому принадлежит пауза — интерактивное эссе о том, как интерфейсы меняют переживание ожидания. Пятнадцать зон о длительности, ясности и праве распоряжаться своим временем."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Кому принадлежит пауза — интерактивное эссе</title>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
  />
  <style>
    .course-webring {
      margin-top: 64px;
      padding: 24px 0;
      border-top: 1px solid currentColor;
      font-family: Inter, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    .course-webring h2 {
      margin: 0 0 16px;
      font-family: Inter, sans-serif;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
    }
    .course-webring__nav {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 12px 24px;
      align-items: start;
    }
    .course-webring__nav a {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 0;
      box-sizing: border-box;
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }
    .course-webring__nav a:last-child {
      justify-content: flex-end;
      text-align: right;
    }
    .course-webring__nav a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }
    .course-webring--entry .course-webring__nav {
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 720px) {
      .course-webring__nav,
      .course-webring--entry .course-webring__nav {
        grid-template-columns: 1fr;
      }
      .course-webring__nav a:last-child {
        justify-content: flex-start;
        text-align: left;
      }
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
