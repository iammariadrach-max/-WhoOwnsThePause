<!doctype html><meta charset="utf-8"><title>Проверка верстки — 1440 px</title><style>body{margin:0;background:#0b0d0b}iframe{border:0;width:1440px;height:1200px;transform:scale(.46);transform-origin:top left}main{width:663px;height:552px;overflow:hidden}</style><main><iframe src="/"></iframe></main><output style="display:block;color:#aaa;font:11px monospace;white-space:pre-wrap"></output><script>
const frame=document.querySelector('iframe');const params=new URLSearchParams(location.search);if(params.has('clean'))document.querySelector('output').style.display='none';const width=Number(params.get('width')||1440);const section=params.get('section')||'perception';const scale=Math.min(1,663/width);frame.style.width=width+'px';frame.style.transform=`scale(${scale})`;frame.style.height=(552/scale)+'px';frame.addEventListener('load',()=>{const timer=setInterval(()=>{const target=frame.contentDocument.getElementById(section);if(target){clearInterval(timer);frame.contentDocument.fonts.ready.then(()=>{setTimeout(()=>{const d=frame.contentDocument,w=frame.contentWindow;w.scrollTo(0,target.getBoundingClientRect().top+w.scrollY-76);const label=d.querySelector('.choice label span');document.querySelector('output').textContent=JSON.stringify({width:w.innerWidth,overflow:d.documentElement.scrollWidth-w.innerWidth,choiceColor:w.getComputedStyle(label).color,sources:d.querySelectorAll('.source-list li').length,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length,grid:w.getComputedStyle(d.querySelector('.attention')).gridTemplateColumns,margin:w.getComputedStyle(d.querySelector('.attention')).paddingLeft,gutter:w.getComputedStyle(d.querySelector('.attention')).columnGap,bodyFont:w.getComputedStyle(d.querySelector('.illustrated-reading-copy .body')).font,negativeTracking:[...d.querySelectorAll('.intro-body *, .reading-revision *')].filter(e=>!e.closest('.footer-signature')&&parseFloat(w.getComputedStyle(e).letterSpacing)<0).length,centered:[...d.querySelectorAll('.intro-body *, .reading-revision *')].filter(e=>w.getComputedStyle(e).textAlign==='center').length,timerTop:[d.querySelector('.perception .instruction'),d.querySelector('.perception-readout')].map(e=>Math.round(e.getBoundingClientRect().top)),fields:[...d.querySelectorAll('.reflection-field canvas')].map(e=>e.dataset.renderer)},null,2)},500)});}},100)});
</script>
